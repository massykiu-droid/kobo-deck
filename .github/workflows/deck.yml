name: Aggiorna deck

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get install -y -q fonts-dejavu-core
          pip install -q pillow
      - name: Genera immagine
        env:
          KIOSK_URL: ${{ secrets.KIOSK_URL }}
          LAT: "45.4905"
          LON: "9.2953"
          PLACE: Segrate
        run: python render.py --out public/deck.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4

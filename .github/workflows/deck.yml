name: Aggiorna deck

on:
  schedule:
    # GitHub salta spesso le esecuzioni programmate ai minuti "tondi": si usano minuti meno affollati.
    # In piu', ogni esecuzione ne riavvia una nuova a fine lavoro (ultimo passo), cosi' il ritmo
    # di 15 minuti non dipende solo dalla pianificazione.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get install -y -q fonts-dejavu-core
          pip install -q pillow
      - name: Genera immagine
        env:
          KIOSK_URL: ${{ secrets.KIOSK_URL }}
          LAT: "45.4905"
          LON: "9.2953"
          PLACE: Segrate
          SITE_URL: https://massykiu-droid.github.io/kobo-deck
        run: python render.py --out public/deck.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
      - name: Prossimo aggiornamento tra circa 14 minuti
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 840
          gh workflow run deck.yml --ref main --repo "${{ github.repository }}"
